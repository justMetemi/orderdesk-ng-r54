async function boot(){
  if(!sb||booting)return;

  try{
    const{data:{session}}=await sb.auth.getSession();
    if(!session){landing();return;}
    let{data:b,error:be}=await sb.from("businesses").select("*").maybeSingle();if(!b&&be){try{b=JSON.parse(localStorage.getItem("od_biz"))}catch(_){}}if(b)localStorage.setItem("od_biz",JSON.stringify(b));
    if(!b){
      const md=session.user.user_metadata||{},r=await sb.from("businesses").insert({name:md.biz||"My Business",owner_name:md.own||md.full_name,phone:md.ph,email:session.user.email}).select().single();
      if(r.error){toast(r.error.message,1);return;}
      b=r.data;
      if(!md.biz){view="settings";setTimeout(()=>toast("Welcome! Please set your business name in Settings."),700);}
    }
    // Every successful sign-in returns the user to the main dashboard.
    view="dashboard";
    biz=b;uid=session.user.id;shell();$("#main").innerHTML='<p class="empty">Loading…</p>';
    await load();draw();syncQ();
    await maybeStartOnboarding();
    const al=alerts().length;if(al&&view==="dashboard")toast("You have "+al+" alert"+(al>1?"s":"")+" to check.");
  }catch(err){toast(err.message||"Could not load your dashboard.",1);}
  finally{booting=false;}
}

const daysSince=d=>Math.floor((Date.now()-new Date(d))/864e5);
function followList(){const L=[];C.forEach(c=>{const os=O.filter(o=>o.customer_id===c.id&&o.status!=="Cancelled");if(!os.length)return;const owe=os.filter(o=>bal(o)>0),b=owe.reduce((t,o)=>t+bal(o),0),last=os.map(o=>o.order_date).sort().pop(),d=daysSince(last);
if(b>0)L.push({c,w:2,k:b,why:"Owes "+N(b),o:owe[0],t:"Payment reminder"});else if(d>=30)L.push({c,w:1,k:d,why:"No order for "+d+" days",o:os.slice().sort((x,y)=>y.order_date.localeCompare(x.order_date))[0],t:"We miss you"})});return L.sort((a,b)=>b.w-a.w||b.k-a.k)}

async function initStoreBankFields(){

    if(!banks.length)throw new Error("No supported banks were returned. Check your Paystack configuration.");

    if(currentName&&!select.value){const opt=document.createElement("option");opt.value=currentCode||"legacy";opt.textContent=currentName+" (saved previously)";opt.selected=true;select.insertBefore(opt,select.children[1]||null)}
    setStatus("Choose a bank, enter the 10-digit account number, then verify.");
  }catch(err){select.innerHTML='<option value="">Bank list unavailable</option>';setStatus(err.message||"Unable to load banks.","error")}
  select.addEventListener("change",()=>{name.value="";setStatus("Bank changed. Verify the account again.")});
  verify.addEventListener("click",async()=>{

  });
}

 if(reqError){return toast('Apply r5_3_commercial_upgrade.sql before selecting a plan.',1)}
 const pending=(reqs||[]).find(x=>x.status==='pending');
 const {data:planRows}=await sb.from('orderdesk_plan_config').select('plan_code,monthly_price_ngn').in('plan_code',['essentials','standard']);const {data:paymentDetails}=await sb.rpc('get_orderdesk_subscription_payment_details');const monthly={essentials:Number(planRows?.find(x=>x.plan_code==='essentials')?.monthly_price_ngn||10000),standard:Number(planRows?.find(x=>x.plan_code==='standard')?.monthly_price_ngn||15000)};const rates={essentials:{1:monthly.essentials,3:monthly.essentials*2.85,6:monthly.essentials*5.4,12:monthly.essentials*10.2},standard:{1:monthly.standard,3:monthly.standard*2.85,6:monthly.standard*5.4,12:monthly.standard*10.2}};
 const status=pending?`<b>Payment submitted — awaiting verification</b><p class="subtle">${esc(pending.plan_code)} · ${pending.billing_period_months} month(s) · ₦${Number(pending.amount_ngn).toLocaleString('en-NG')}</p>`:'<b>Select your plan and billing duration</b>';
 const paymentCard=paymentDetails?.enabled?`<div class="card" style="margin:12px 0"><b>${esc(paymentDetails.bank_name)}</b><p>Account name: <b>${esc(paymentDetails.account_name)}</b><br>Account number: <b>${esc(paymentDetails.account_number)}</b></p>${paymentDetails.instructions?`<small>${esc(paymentDetails.instructions)}</small>`:''}<small>Transfer the exact amount shown above.</small></div>`:'<p class="subtle">Subscription payments are temporarily unavailable. The platform owner must add and enable the official OrderDesk transfer details in Admin before you make a payment. Do not transfer money to an unverified account.</p>';
 const formHtml=pending?'<p>Please wait for the platform owner to review your existing payment request before submitting another payment.</p>':paymentDetails?.enabled?`<form id="commercialPay"><label>Plan<select name="plan" id="commercialPlan"><option value="essentials">Essentials · ₦10,000/month</option><option value="standard">Standard · ₦15,000/month</option></select></label><label>Duration<select name="months" id="commercialMonths"><option value="1">1 month</option><option value="3">3 months · save 5%</option><option value="6">6 months · save 10%</option><option value="12">12 months · save 15%</option></select></label><div class="card" style="margin:12px 0"><small>Total advance payment</small><h2 id="commercialTotal" style="margin:4px 0">₦10,000</h2><small id="commercialMonthly" class="subtle">₦10,000 per month</small></div>${paymentCard}<label>Transaction reference<input name="reference" required maxlength="120" placeholder="Enter your transfer reference"></label><label>Transfer receipt<input name="receipt" type="file" accept="image/*,application/pdf" required></label><button class="btn p">Submit payment for verification</button></form>`:paymentCard;
 const m=modal(`<h2>Choose your OrderDesk plan</h2><p class="subtle">Your subscription and AI allowance activate only after the transfer is verified. If you already have a paid period, a new plan starts when that period ends.</p><div class="card" style="margin:12px 0">${status}</div>${formHtml}<div id="commercialHistory" style="margin-top:14px"></div>`);
 const form=m.querySelector('#commercialPay');
 const updateTotal=()=>{if(!form)return;const plan=form.plan.value,months=Number(form.months.value),amount=rates[plan][months];m.querySelector('#commercialTotal').textContent='₦'+amount.toLocaleString('en-NG');m.querySelector('#commercialMonthly').textContent='₦'+(amount/months).toLocaleString('en-NG')+' per month on average';};
 form?.querySelectorAll('select').forEach(x=>x.addEventListener('change',updateTotal));updateTotal();
 if(form)form.onsubmit=async e=>{e.preventDefault();const fd=new FormData(form),file=fd.get('receipt'),reference=String(fd.get('reference')||'').trim();if(!file||!file.size)return toast('Attach your transfer receipt.',1);if(file.size>5*1024*1024)return toast('Receipt must be 5MB or smaller.',1);const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=`${biz.id}/${crypto.randomUUID()}.${ext}`;const up=await sb.storage.from('subscription-receipts').upload(path,file,{upsert:false,contentType:file.type||'application/octet-stream'});if(up.error)return toast(up.error.message,1);const result=await sb.rpc('customer_submit_commercial_payment_request',{p_plan_code:fd.get('plan'),p_months:Number(fd.get('months')),p_transaction_reference:reference,p_receipt_path:path});if(result.error){await sb.storage.from('subscription-receipts').remove([path]);return toast(result.error.message,1)}closeM();toast('Payment submitted. Your plan will activate after verification.');settings();};
 const hist=m.querySelector('#commercialHistory');if(hist)hist.innerHTML=(reqs||[]).map(r=>`<p class="subtle">${new Date(r.created_at).toLocaleDateString('en-NG')} · ${esc(r.plan_code)} · ${r.billing_period_months} month(s) · ${esc(r.status)}${r.rejection_note?' · '+esc(r.rejection_note):''}</p>`).join('');
}
async function refreshBillingStatus(){const el=document.querySelector('#billingStatus');if(!el)return;const [ent,req]=await Promise.all([sb.rpc('get_orderdesk_entitlements'),sb.from('commercial_subscription_requests').select('*').eq('business_id',biz.id).order('created_at',{ascending:false}).limit(1)]);if(ent.error){el.textContent='Plan information is unavailable. Apply the commercial upgrade migration.';return}const e=ent.data||{},latest=req.data?.[0],paid=!!e.is_paid_period;const label=paid?(e.subscription_ends_at?`${e.plan_name} active until ${new Date(e.subscription_ends_at).toLocaleDateString('en-NG')}`:`${e.plan_name} active`):'Free plan active';el.innerHTML=`<b class="${paid?'ok':''}">${esc(label)}</b>${latest?.status==='pending'?'<br>Payment submitted — awaiting verification.':latest?.status==='rejected'?`<br><span class="bad">Last payment rejected:</span> ${esc(latest.rejection_note||'Please resubmit after checking the receipt.')}`:''}<br><small>AI allowance: ${Number(e.ai_text_units||0).toLocaleString('en-NG')} text messages and ${Number(e.ai_image_units||0).toLocaleString('en-NG')} image credits per applicable allowance period.</small>`;const current=document.getElementById('currentPlanLabel');if(current)current.innerHTML=`Current plan: <b>${esc(e.plan_name||'Free')}</b>${paid&&e.subscription_ends_at?' · until '+new Date(e.subscription_ends_at).toLocaleDateString('en-NG'):''}`;}
