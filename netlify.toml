[functions]
  directory = "netlify/functions"

[functions."subscription-reminders"]
  schedule = "0 8 * * *"

[[redirects]]
  from = "/shop/*"
  to = "/shop.html?shop=:splat"
  status = 200
  force = true

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/od-build.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
